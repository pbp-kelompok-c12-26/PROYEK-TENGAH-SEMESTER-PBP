{% if messages %}
<div class="space-y-2" role="status" aria-live="polite">
    {% for message in messages %}
    <p class="rounded-2xl px-4 py-3 text-sm font-semibold shadow-sm {% if 'error' in message.tags %}bg-swBerry text-white{% else %}bg-swNavy text-white{% endif %}">
        {{ message }}
    </p>
    {% endfor %}
</div>
{% endif %}
