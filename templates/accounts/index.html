{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white rounded-3xl p-8 border border-swRose/30 shadow-sm">
    
    <!-- Header Form -->
    <div class="text-center mb-8">
        <span class="inline-block px-4 py-1.5 bg-swRose/30 text-swRed rounded-full text-xs font-bold uppercase tracking-wider mb-3">
            Welcome Back
        </span>
        <h1 class="font-logo text-4xl text-swRed mb-2">Sign In</h1>
        <p class="text-swDark/60 text-sm">Masuk ke akun Swapdrobe kamu</p>
    </div>

    <!-- Form Login -->
    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-swDark mb-2">Username / Email</label>
            <input type="text" name="username" class="w-full px-4 py-3 rounded-2xl bg-swOffWhite/50 border border-swRose/40 text-swDark focus:outline-none focus:border-swBlue transition-colors text-sm" placeholder="Masukkan username">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-swDark mb-2">Password</label>
            <input type="password" name="password" class="w-full px-4 py-3 rounded-2xl bg-swOffWhite/50 border border-swRose/40 text-swDark focus:outline-none focus:border-swBlue transition-colors text-sm" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full py-3.5 px-6 rounded-full bg-swRed text-white font-bold text-sm shadow-sm hover:bg-swBlue transition-colors">
            Masuk Sekarang
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-swDark/60">
        Belum punya akun? 
        <a href="#" class="font-bold text-swBlue hover:underline">Daftar di sini</a>
    </div>

</div>
{% endblock %}
