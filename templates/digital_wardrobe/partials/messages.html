<div id="wardrobe-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] flex flex-col items-center gap-2 w-[calc(100%-2rem)] max-w-md" aria-live="polite">
    {% for message in messages %}
    <div data-toast class="w-full px-4 py-3 rounded-xl shadow-lg text-sm font-medium {% if message.tags == 'error' %}bg-swBerry text-white{% else %}bg-swNavy text-white{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
