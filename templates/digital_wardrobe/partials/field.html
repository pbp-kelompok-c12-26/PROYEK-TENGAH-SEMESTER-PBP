<div class="wd-field">
    <label for="{{ field.id_for_label }}" class="wd-field__label">
        {{ field.label }}{% if field.field.required or required %} <span class="wd-required">*</span>{% endif %}
    </label>
    {{ field }}
    {% for error in field.errors %}
    <p class="wd-error">{{ error }}</p>
    {% endfor %}
</div>
