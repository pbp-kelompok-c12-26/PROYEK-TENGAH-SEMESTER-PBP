{% comment %}Avatar profil/inisial. Pakai: include 'swap_requests/partials/avatar.html' with person=user size='w-9 h-9 text-sm'{% endcomment %}
<a href="{% url 'accounts:public_profile' person.username %}" title="Lihat profil @{{ person.username }}" class="{{ size|default:'w-9 h-9 text-sm' }} shrink-0 rounded-full overflow-hidden bg-gradient-to-br from-swBerry via-swPink to-swPlum ring-2 ring-white text-white font-bold inline-flex items-center justify-center hover:ring-swPink transition-all">
    {% if person.profile.profile_picture %}
    <img src="{{ person.profile.profile_picture.url }}" alt="{{ person.username }}" class="w-full h-full object-cover">
    {% else %}
    {{ person.username|first|upper }}
    {% endif %}
</a>
