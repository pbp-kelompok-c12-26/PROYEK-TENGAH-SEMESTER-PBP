{% comment %}
Pop-up konfirmasi untuk semua aksi penting.
Tambahkan atribut data-confirm="Teks pertanyaan" (dan opsional data-confirm-yes="Ya, hapus") di <form>.
{% endcomment %}
<dialog id="swap-confirm" class="rounded-2xl p-0 w-[calc(100%-2rem)] max-w-sm backdrop:bg-swNavy/40">
    <div class="p-6 space-y-4">
        <h3 class="text-lg font-extrabold text-swNavy">Yakin?</h3>
        <p class="text-sm text-swSlate" data-confirm-text></p>
        <div class="flex justify-end gap-2">
            <button type="button" data-confirm-cancel class="h-10 px-4 rounded-full border border-swNavy/25 text-swNavy text-sm font-semibold hover:bg-swCream">Batal</button>
            <button type="button" data-confirm-ok class="h-10 px-4 rounded-full sw-btn-holo text-white text-sm font-bold">Ya, lanjutkan</button>
        </div>
    </div>
</dialog>
<script>
(() => {
    const dialog = document.getElementById('swap-confirm');
    if (!dialog) return;
    const okBtn = dialog.querySelector('[data-confirm-ok]');
    let pending = null;
    document.querySelectorAll('form[data-confirm]').forEach((form) => {
        form.addEventListener('submit', (e) => {
            if (form.dataset.confirmed === '1') return;
            e.preventDefault();
            pending = { form, submitter: e.submitter };
            dialog.querySelector('[data-confirm-text]').textContent = form.dataset.confirm;
            okBtn.textContent = form.dataset.confirmYes || 'Ya, lanjutkan';
            const danger = form.dataset.confirmDanger === '1';
            okBtn.classList.toggle('sw-btn-holo', !danger);
            okBtn.classList.toggle('bg-swBerry', danger);
            dialog.showModal();
        });
    });
    dialog.querySelector('[data-confirm-cancel]').addEventListener('click', () => dialog.close());
    okBtn.addEventListener('click', () => {
        if (!pending) return;
        pending.form.dataset.confirmed = '1';
        dialog.close();
        pending.form.requestSubmit(pending.submitter || undefined);
    });
})();
</script>
