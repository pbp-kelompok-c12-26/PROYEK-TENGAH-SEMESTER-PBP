{% comment %}
Pop-up konfirmasi untuk semua aksi penting.
Tambahkan atribut data-confirm="Teks pertanyaan" (dan opsional data-confirm-yes="Ya, hapus") di <form>.
{% endcomment %}
<dialog id="swap-confirm" class="sr-dialog">
    <div class="sr-dialog__body">
        <h3 class="sr-dialog__title">Yakin?</h3>
        <p class="sr-dialog__text" data-confirm-text></p>
        <div class="sr-dialog__actions">
            <button type="button" data-confirm-cancel class="sr-dialog__cancel">Batal</button>
            <button type="button" data-confirm-ok class="sr-dialog__ok sw-btn-holo">Ya, lanjutkan</button>
        </div>
    </div>
</dialog>
<script>
(() => {
    const dialog = document.getElementById('swap-confirm');
    if (!dialog) return;
    const okBtn = dialog.querySelector('[data-confirm-ok]');
    let pending = null;
    // Tangkap sebelum event mencapai handler submit HTMX di form. Kalau hanya
    // preventDefault pada fase bubble, HTMX bisa mengirim request lebih dulu.
    document.addEventListener('submit', (e) => {
        const form = e.target.closest('form[data-confirm]');
        if (!form) return;
        if (form.dataset.confirmed === '1') {
            delete form.dataset.confirmed;
            return;
        }
        e.preventDefault();
        e.stopImmediatePropagation();
        pending = { form, submitter: e.submitter };
        dialog.querySelector('[data-confirm-text]').textContent = form.dataset.confirm;
        okBtn.textContent = form.dataset.confirmYes || 'Ya, lanjutkan';
        const danger = form.dataset.confirmDanger === '1';
        okBtn.classList.toggle('sw-btn-holo', !danger);
        okBtn.classList.toggle('sr-dialog__ok--danger', danger);
        dialog.showModal();
    }, true);
    dialog.querySelector('[data-confirm-cancel]').addEventListener('click', () => dialog.close());
    okBtn.addEventListener('click', () => {
        if (!pending) return;
        const { form, submitter } = pending;
        pending = null;
        form.dataset.confirmed = '1';
        dialog.close();
        if (submitter) form.requestSubmit(submitter);
        else form.requestSubmit();
    });
})();
</script>
