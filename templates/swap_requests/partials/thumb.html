{% comment %}Foto pakaian. Pakai: include 'swap_requests/partials/thumb.html' with item=pakaian name=nama size='w-12 h-12'{% endcomment %}
<span class="{{ size|default:'w-12 h-12' }} shrink-0 rounded-xl overflow-hidden bg-swBlush ring-1 ring-swNavy/10 inline-flex items-center justify-center">
    {% if item and item.image %}
    <img src="{{ item.image.url }}" alt="{{ name|default:item.name }}" loading="lazy" class="w-full h-full object-cover">
    {% else %}
    <svg class="w-1/2 h-1/2 text-swSlate/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a2 2 0 1 0-2 2m2-2v2.5L3 15h18l-9-8.5"/></svg>
    {% endif %}
</span>
