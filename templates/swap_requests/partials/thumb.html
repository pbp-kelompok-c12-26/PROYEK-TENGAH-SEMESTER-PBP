{% comment %}Foto pakaian. Pakai: include 'swap_requests/partials/thumb.html' with item=pakaian name=nama size='lg'
Ukuran: size='md' (default) | 'lg' | 'xl' | 'hero' (lihat .sr-thumb--... di swap_requests.css){% endcomment %}
<span class="sr-thumb sr-thumb--{{ size|default:'md' }}">
    {% if item and item.image %}
    <img src="{{ item.image.url }}" alt="{{ name|default:item.name }}" loading="lazy">
    {% else %}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a2 2 0 1 0-2 2m2-2v2.5L3 15h18l-9-8.5"/></svg>
    {% endif %}
</span>
