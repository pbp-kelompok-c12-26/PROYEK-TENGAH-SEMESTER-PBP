{% comment %}Pakai: with swap=s  — atau with label='Pending' style='sr-status--pending'
Warna tiap status: SwapRequest.STATUS_STYLES (models.py) + .sr-status--... (swap_requests.css){% endcomment %}
{% if swap %}
<span class="sr-status {{ swap.status_style }}">{{ swap.get_status_display }}</span>
{% else %}
<span class="sr-status {{ style }}">{{ label }}</span>
{% endif %}
