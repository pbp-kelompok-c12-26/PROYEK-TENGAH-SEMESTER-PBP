<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Swapdrobe{% endblock %}</title>
    
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Config Warna Custom di Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              popLime: '#E4FE91',
              popFuchsia: '#E57BF7',
              popAqua: '#95DFD3',
              popBlue: '#3947F2',
              popDark: '#121212',
            }
          }
        }
      }
    </script>
    
    {% block meta %}{% endblock %}
</head>
<body class="bg-[#F4F4F0] text-popDark font-sans flex flex-col min-h-screen border-t-8 border-popBlue">

    <!-- NAVBAR POP STYLE -->
    <nav class="bg-popLime border-b-4 border-popDark px-4 py-3 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <!-- Logo -->
            <a href="/" class="flex items-center gap-2 no-underline">
                <span class="text-2xl font-black bg-popFuchsia text-white px-3 py-1 rounded-lg border-2 border-popDark shadow-[3px_3px_0px_#121212] -rotate-2 inline-block">
                    SWAPDROBE
                </span>
            </a>
            
            <!-- Navigation Links -->
            <div class="flex flex-wrap items-center gap-2 text-sm font-bold">
                <a href="{% url 'accounts:index' %}" class="bg-white text-popDark px-3 py-1.5 rounded-lg border-2 border-popDark shadow-[2px_2px_0px_#121212] hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all no-underline">
                    👤 Accounts
                </a>
                <a href="{% url 'digital_wardrobe:index' %}" class="bg-popAqua text-popDark px-3 py-1.5 rounded-lg border-2 border-popDark shadow-[2px_2px_0px_#121212] hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all no-underline">
                    👗 Wardrobe
                </a>
                <a href="{% url 'items_for_swap:index' %}" class="bg-popFuchsia text-white px-3 py-1.5 rounded-lg border-2 border-popDark shadow-[2px_2px_0px_#121212] hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all no-underline">
                    🛍️ Catalog
                </a>
                <a href="{% url 'swap_request:index' %}" class="bg-popBlue text-white px-3 py-1.5 rounded-lg border-2 border-popDark shadow-[2px_2px_0px_#121212] hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all no-underline">
                    🔄 Swap
                </a>
                <a href="{% url 'outfit_calendar:index' %}" class="bg-white text-popDark px-3 py-1.5 rounded-lg border-2 border-popDark shadow-[2px_2px_0px_#121212] hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all no-underline">
                    📅 Calendar
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENT AREA -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER POP STYLE -->
    <footer class="bg-popDark text-white border-t-4 border-popDark py-6 text-center mt-10">
        <p class="font-bold text-popLime">
            &copy; 2026 SWAPDROBE <span class="text-popFuchsia">★</span> Match Your Outfit!
        </p>
    </footer>

    {% block script %}{% endblock %}
</body>
</html>
