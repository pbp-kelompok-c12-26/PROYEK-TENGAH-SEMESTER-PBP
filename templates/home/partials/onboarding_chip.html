{% comment %}
Satu chip pilihan. Pakai: include ... with option=opt size='compact'
Ukuran: 'md' (default), 'compact', 'tall', 'wrap' (lihat .sw-chip--... di static/css/components.css)
{% endcomment %}
<label class="sw-chip-label">
    {{ option.tag }}
    {% if size and ' ' in size %}
    {# Sementara: template yang masih mengirim class Tailwind sebagai size tetap tampil benar #}
    <span class="sw-chip {{ size }}">{{ option.choice_label }}</span>
    {% else %}
    <span class="sw-chip sw-chip--{{ size|default:'md' }}">{{ option.choice_label }}</span>
    {% endif %}
</label>
