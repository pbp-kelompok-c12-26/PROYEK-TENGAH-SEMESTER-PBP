{% comment %}Tombol like untuk kartu dan gambar detail Items for Swap.{% endcomment %}
{% if listing.status == 'available' and listing.user_id != request.user.id or listing.is_liked %}
<form method="post" action="{% url 'home:toggle_like' listing.pk %}"
      data-like-toggle data-liked="{{ listing.is_liked|yesno:'true,false' }}"
      data-item-name="{{ item.name }}"
      data-remove-on-unlike="{% if request.resolver_match.view_name == 'home:liked_items' %}true{% else %}false{% endif %}"
      class="absolute {% if compact %}top-1 right-1{% else %}top-2 right-2{% endif %} z-20">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" data-like-button
            aria-label="{% if listing.is_liked %}Hapus {{ item.name }} dari pakaian disukai{% else %}Sukai {{ item.name }}{% endif %}"
            aria-pressed="{{ listing.is_liked|yesno:'true,false' }}"
            class="flex {% if compact %}h-9 w-9{% else %}h-11 w-11{% endif %} items-center justify-center rounded-full shadow-sm ring-1 ring-swNavy/5 transition-transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-swPlum {% if listing.is_liked %}bg-[#D50959]{% else %}bg-white{% endif %}">
        <svg class="{% if compact %}h-6 w-6{% else %}h-7 w-7{% endif %}" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
                <linearGradient id="liked-heart-{{ listing.pk }}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#F6A9C4"/>
                    <stop offset="52%" stop-color="#FFF9FB"/>
                    <stop offset="100%" stop-color="#A9C8FF"/>
                </linearGradient>
            </defs>
            <path data-like-heart d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21l7.78-7.55 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"
                  fill="{% if listing.is_liked %}url(#liked-heart-{{ listing.pk }}){% else %}none{% endif %}"
                  stroke="#171F63" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
</form>
{% endif %}
