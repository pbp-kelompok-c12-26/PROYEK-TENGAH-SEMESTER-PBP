<div class="home-field">
    <label for="filter-{{ name }}" class="home-field__label">{{ label }}</label>
    <select id="filter-{{ name }}" name="{{ name }}" form="catalog-filter-form"
            class="home-select">
        <option value="">{{ placeholder }}</option>
        {% for value, text in choices %}
        <option value="{{ value }}" {% if value == selected %}selected{% endif %}>{{ text }}</option>
        {% endfor %}
    </select>
</div>
