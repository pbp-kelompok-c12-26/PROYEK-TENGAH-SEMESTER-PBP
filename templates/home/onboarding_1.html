{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SwapDrobe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        swNavy: '#171F63',
                        swPlum: '#6063B4',
                        swCream: '#F7F5F0',
                        swLilac: '#E6C4F9',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-swCream font-sans text-swNavy antialiased">

    <main class="relative flex min-h-screen flex-col items-center px-6 py-8">

        <!-- Skip -->
        <a href="{% url 'home:index' %}"
           class="absolute right-6 top-8 inline-flex items-center gap-1 text-base font-semibold text-swNavy transition hover:opacity-70 md:right-12">
            Skip <span aria-hidden="true">›</span>
        </a>

        <!-- Progress indicator -->
        <div class="mt-12 flex items-center justify-center gap-3"
             aria-label="Halaman 1 dari 3">
            <span class="h-3.5 w-3.5 rounded-full bg-[#08078B]"></span>
            <span class="h-3.5 w-3.5 rounded-full bg-[#CECECE]"></span>
            <span class="h-3.5 w-3.5 rounded-full bg-[#CECECE]"></span>
        </div>

        <!-- Illustration -->
        <div class="mt-8 flex w-full max-w-3xl items-center justify-center">
            <img
                src="{% static 'images/burhan_onboarding.png' %}"
                alt="Ilustrasi lemari pakaian berkelanjutan SwapDrobe"
                class="h-auto max-h-[360px] w-full max-w-[620px] object-contain"
            >
        </div>

        <!-- Welcome message -->
        <section class="mt-8 w-full text-center">
            <h1 class="text-3xl font-extrabold leading-tight text-[#08078B] sm:text-4xl md:text-5xl">
                Welcome to SwapDrobe
            </h1>

            <p class="mx-auto mt-3 max-w-5xl text-base leading-relaxed text-[#505050] sm:text-lg">
                Build your digital wardrobe, discover pre-loved finds, and give your clothes a second life.
            </p>
        </section>

        <!-- Next page -->
        <a href="{% url 'home:onboarding' %}?step=2"
           class="mt-8 flex min-h-[82px] w-full max-w-[492px] items-center justify-center gap-4 rounded-[28px] bg-[#3767B4] px-6 py-5 text-xl font-bold text-white transition hover:bg-[#2E579C] active:scale-[0.98] sm:text-2xl">
            <span aria-hidden="true" class="text-4xl font-light leading-none">⟶</span>
            <span>Let's Get Started</span>
        </a>

    </main>

</body>
</html>
