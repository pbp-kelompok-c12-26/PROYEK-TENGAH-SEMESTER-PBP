name: Push to PWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Push to PWS
      env:
        PWS_URL: ${{ secrets.PWS_URL }}
      run: |
          current_branch=$(git branch --show-current)
          echo "Current branch: $current_branch"

          # PWS cuma tempat deploy: samakan persis dengan main di GitHub
          if ! push_output=$(git push --force "$PWS_URL" "$current_branch:main" 2>&1); then
            echo "Push failed with output: $push_output"
            exit 1
          fi
          echo "Push successful with output: $push_output"